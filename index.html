<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2b1a">
<title>Squirrel Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <span id="acorns">Acorns 0/20</span>
  <button id="mute" type="button" aria-label="Toggle sound">Sound on</button>
  <span id="time">0:00.0</span>
</div>

<div id="stick" hidden><div id="knob"></div></div>

<div id="start" class="panel">
  <h1>Squirrel Game</h1>
  <p>Find every acorn in the park as fast as you can.</p>
  <p id="help" class="dim"></p>
  <button id="play" type="button" autofocus>Play</button>
</div>

<div id="win" class="panel" hidden>
  <h1>Winter is sorted!</h1>
  <p id="result"></p>
  <p id="best" class="dim"></p>
  <button id="again" type="button">Play again</button>
</div>

<script src="js/sprites.js"></script>
<script src="js/level.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
